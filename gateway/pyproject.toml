[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkmate-gateway"
version = "0.1.0"
description = "Local-first gateway for the InkMate e-paper companion"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0,<2"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/inkmate_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
