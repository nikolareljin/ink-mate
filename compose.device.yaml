services:
  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INKMATE_HTTP_BIND_ADDRESS: ${INKMATE_BIND_ADDRESS}
    network_mode: host
    # Host networking reaches a loopback-only local model service directly.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - inkmate-model-cache:/var/cache/inkmate
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; host=os.getenv('INKMATE_BIND_ADDRESS', '127.0.0.1'); urllib.request.urlopen('http://' + host + ':' + os.getenv('INKMATE_GATEWAY_PORT', '8080') + '/healthz', timeout=2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  inkmate-model-cache:
