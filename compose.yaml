services:
  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${INKMATE_BIND_ADDRESS:-127.0.0.1}:${INKMATE_PORT:-8080}:8080"
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
