---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project:
    uses: nikolareljin/ci-helpers/.github/workflows/ci.yml@production
    with:
      python_version: "3.12"
      working_directory: "."
      lint_command: >-
        python -m pip install -e './gateway[test]'
        && python -m compileall -q gateway/src gateway/tests protocol
      test_command: >-
        python -m pytest gateway/tests
        && python protocol/check_schemas.py
        && cmake -S firmware/components/inkmate_core/test
        -B firmware/build/host-tests
        && cmake --build firmware/build/host-tests
        && ctest --test-dir firmware/build/host-tests --output-on-failure
      docker_command: >-
        cp .env.example .env
        && docker compose config --quiet
        && docker compose build

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board_profile: [v1, v2]
        include:
          - board_profile: v1
            defaults: "sdkconfig.defaults;sdkconfig.v1"
          - board_profile: v2
            defaults: "sdkconfig.defaults;sdkconfig.v2"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build ${{ matrix.board_profile }} firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: firmware
          command: SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" idf.py build
