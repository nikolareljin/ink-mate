name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    uses: nikolareljin/ci-helpers/.github/workflows/ci.yml@production
    with:
      python_version: "3.12"
      working_directory: gateway
      lint_command: "python -m pip install -e '.[test]' && python -m compileall -q src tests"
      test_command: "python -m pytest"

  firmware-host-tests:
    uses: nikolareljin/ci-helpers/.github/workflows/ci.yml@production
    with:
      working_directory: firmware/components/inkmate_core/test
      build_command: "cmake -S . -B build && cmake --build build"
      test_command: "ctest --test-dir build --output-on-failure"

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board_profile: [v1, v2]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build ${{ matrix.board_profile }} firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: firmware
          command: SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.${{ matrix.board_profile }}" idf.py build

  compose:
    uses: nikolareljin/ci-helpers/.github/workflows/ci.yml@production
    with:
      docker_command: "cp .env.example .env && docker compose config --quiet && docker compose build"
